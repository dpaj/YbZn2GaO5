# configs/sunny_validation_controls.toml
#
# Preliminary Sunny.jl validation controls for the YbZn2GaO5 repo.
# These scripts use the same canonical parameter file as the analytical co-fit:
#
#   configs/best_fit_parameters.toml
#
# The goal is validation, not replacement, of the fast analytical polarized-phase
# calculator.  The long-term goal is to use Sunny.jl for things the analytical
# polarized model cannot do, especially zero-field magnetic correlations.

[paths]
best_fit_parameters_toml = "configs/best_fit_parameters.toml"
magnetization_csv = "data/magnetization/YZGO_MvB_black_curve_digitized_visible.csv"
neutron_1d_dir = "data/neutron/CNCS_1d_scans"
cif_path = "data/cif/ICSD_CollCode138765.cif"
figure_subdir = "results/figures/sunny_validation"
table_subdir = "results/feature_tables/sunny_validation"

[common]
# Current validation target: field-polarized H || c.
field_direction = [0.0, 0.0, 1.0]
fields_T = [9.0, 14.0]
spin_S = 0.5
seed = 20260611

# Sunny neutron-intensity gauge.  For H || c, ssf_perp needs nonzero transverse
# moment-tensor components; otherwise the KPM neutron intensity can vanish.
# This is not the fitted physical gperp.  The effective flat/dispersive
# transverse intensity ratio remains handled externally by gperp_ratio.
sunny_transverse_gxy = 1.0

# Effective triangular-lattice geometry used by the preliminary Sunny builders.
# The analytical comparison uses reciprocal coordinates more than absolute lengths,
# so these lengths mostly set plotting/convention scales for Sunny.
lattice_a_angstrom = 3.4
lattice_c_angstrom = 10.0

[weights]
# Best-fit flat / dispersive S=1/2 fraction.
#
# In configs/best_fit_parameters.toml this is stored as:
#
#   [neutron_extrinsic]
#   second_kernel_relative_intensity = 0.1579822309
#
# Despite the historical name, in the shared-fraction model this is the fitted
# relative population/weight of the nondispersive flat S=1/2 component compared
# with the dispersive component.  The Sunny scripts use it when the flag below
# is true; otherwise they use the manual diagnostic value.
use_second_kernel_relative_intensity_from_best_fit = true
manual_second_kernel_relative_intensity = 0.1579822309

[magnetization]
Bmin_T = 0.0
Bmax_T = 7.0
nB = 141
temperature_K = 0.42

# Analytical co-fit scale convention.  The default uses the best-fit
# magnetization_global_scale from configs/best_fit_parameters.toml and applies
# it to the full unscaled magnetization comparison curve, including chi_vv B.
use_magnetization_global_scale_from_best_fit = true
manual_magnetization_global_scale = 1.0
normalize_second_kernel_weight = true
include_chi_vv = true

# Diagnostic-only vertical scaling can be enabled if desired, but should not be
# used for the primary Sunny validation curve.
fit_vertical_scale = false

[meanfield]
# Mean-field bridge model.  This is a numerical version of the current analytical
# ingredients rather than a full Sunny minimization.
mode = "linear_saturation"
n_disorder_samples = 50000
normal_quad_n = 301
normal_quad_zmax = 5.0

[largecell]
# Sunny minimize_energy! validation.  These are extrinsic finite-size calculator
# controls, not fitted microscopic parameters.
#
# `system_size` is the final finite Sunny supercell used for the calculation.
# `dims` is the seed Sunny system size.  If `system_size` is present, the code
# derives repeat_factor = system_size ./ dims and checks consistency.
system_size = [4, 4, 1]
dims = [4, 4, 1]
repeat_factor = [1, 1, 1]
include_exchange_disorder = true
include_gzz_disorder = true
maxiters = 1000
randomize_each_field = false
moment_sign = -1.0

[kpm]
# Sunny SpinWaveTheoryKPM validation.  These are extrinsic finite-size calculator
# controls, not fitted microscopic parameters.
#
# `system_size` is the final inhomogeneous Sunny supercell used for KPM.
# `dims` is the smaller seed system constructed before repeat_periodically.
# If `system_size` is present, repeat_factor is derived as system_size ./ dims.
system_size = [24, 24, 1]
dims = [3, 3, 1]
repeat_factor = [4, 4, 1]
include_exchange_disorder = true
include_gzz_disorder = true
maxiters = 1000
tol = 0.05
kernel_fwhm_meV = 0.08
energy_min_meV = 0.0
energy_max_meV = 4.0
n_energy = 161

# Experimental 1D q cuts to validate first.  The exact 2D path can be added later.
qtags = ["0_1_0", "0p33_0p33_0", "0p5_0_0"]

# Match the first Sunny neutron validation to the analytical co-fit target.
Ei_meV = 4.65
temperature_K = 0.07

# Data-file column convention for CNCS_1d_scans files:
#   column 1 = intensity
#   column 2 = error
#   column 3 = energy transfer
# These are retained only for nonstandard diagnostics; the default loader uses
# the analytical co-fit convention directly.
use_analytical_1d_column_convention = true
intensity_column = 1
error_column = 2
energy_column = 3

# Experimental comparison convention.
# `tail_bgsub` / `analytical_bgsub` now ports the same spline/minimum-field
# background construction used by the analytical co-fit:
#   - take the minimum over 0, 9, and 14 T in the low-energy and high-energy tails,
#   - add the fitted 0 T structured residual under K/M background windows,
#   - interpolate the resulting background onto the common energy grid.
data_mode = "tail_bgsub"
background_fields_T = [0.0, 9.0, 14.0]
min_bg_low_window_meV = [0.0, 0.75]
min_bg_high_threshold_meV = 2.5
structured_fit_window_meV = [1.0, 3.0]
background_interp_kind = "pchip"
background_smooth_sigma_meV = 0.0
zeroT_baseline_model = "power_tail"
zeroT_baseline_energy_offset_meV = 0.15
zeroT_baseline_ridge_lambda = 0.0
zeroT_baseline_include_linear_tilt = false
zeroT_baseline_positive_tail = true
clip_negative_structured_residuals = false
# Optional diagnostic fallback; not used when data_mode = "tail_bgsub".
tail_background_windows_meV = [[0.0, 0.75], [2.5, 4.0]]
tail_background_statistic = "median"

# Histogram/interpolate Sunny spectra onto the experimental energy grid.
histogram_mode = "bin_average"

# Intensity convention for Sunny-vs-experiment neutron comparison.
#
# The analytical co-fit neutron_global_scale is useful as a reference, but Sunny
# intensities can have a different absolute normalization.  Choose one of:
#
#   neutron_scale_mode = "best_fit"
#       use neutron_global_scale from configs/best_fit_parameters.toml
#
#   neutron_scale_mode = "manual"
#       use manual_neutron_global_scale below
#
#   neutron_scale_mode = "least_squares"
#       fit one nonnegative intensity scale to experiment
#
#   neutron_scale_mode = "max_match"
#       scale Sunny so its maximum matches the experimental maximum
#
# `neutron_scale_scope = "global"` fits/uses one scale across all fields and q cuts.
# `neutron_scale_scope = "per_cut"` fits a separate visual diagnostic scale for each cut.
neutron_scale_mode = "least_squares"
neutron_scale_scope = "global"
use_neutron_global_scale_from_best_fit = true
manual_neutron_global_scale = 1.0
neutron_scale_fit_window_meV = [0.5, 3.0]
neutron_scale_use_uncertainties = true
neutron_scale_nonnegative = true
neutron_scale_positive_experiment_only = false
neutron_scale_positive_model_only = false

# Guardrails: if the unscaled Sunny model is nearly zero, least-squares or
# max-matching can produce an absurd scale. In that case, fall back to the
# reference/manual scale and treat the result as a physics/path/intensity issue.
neutron_scale_min_model_power = 1e-30
neutron_scale_min_model_peak = 1e-15
neutron_scale_max_abs = 1e8

# total = neutron_scale * (Sunny_disp + flat_weight * Sunny_flat)
# flat_weight = r2 * gperp_ratio^2 by default.
include_gperp_ratio_intensity_weight = true

plot_ylim = [-0.0005, 0.0030]
