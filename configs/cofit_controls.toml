# configs/cofit_controls.toml
#
# Extrinsic controls for the YbZn2GaO5 neutron + magnetization co-fit.
#
# These are not the microscopic Hamiltonian parameters. They control
# which data are fit, how different observables are weighted, how much
# Monte Carlo sampling is used, and how the output is written.

[data]
fields_T = [9.0, 14.0]
neutron_fit_Ei_meV = 4.65
neutron_fit_temperature_K = 0.07
qtags = ["0_1_0", "0p33_0p33_0", "0p5_0_0"]
data_mode = "tail_bgsub"

[weights]
neutron_weight = 1.0
magnetization_weight = 10.0

[optimization]
run_optimization = false
maxiters = 1000

[sampling]
n_samples_per_cut = 100000
final_n_samples_per_cut = 500000
n_samples_magnetization = 15000
final_n_samples_magnetization = 150000

[plotting]
make_plots = true
display_figures = true

[output]
fit_name = "cofit_9T14T_shared_fraction"