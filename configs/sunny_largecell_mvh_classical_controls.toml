# Classical finite-temperature M(H,T) for the minimal single-disordered-phase
# Sunny model, in the same effective-Hamiltonian scheme as the KPM LSWT neutron
# calculation.
#
# Minimal model: ONE disordered phase only (the "dispersive" component: J1, J2,
# gzz, sigma_J, sigma_gzz). The separate non-dispersive/"flat" phase of the
# analytical co-fit is deliberately NOT included. The premise being tested is
# that thermal population of the low-energy modes generated by disorder in a
# single coupled Hamiltonian reproduces what the analytical model represents
# with a second, independent, non-dispersive phase.
#
# Run with:
#   julia --project=. scripts/sunny_largecell_mvh_classical.jl
#
# Sampling scheme. Sunny 0.9.1 has exactly two integrators, and only one is a
# thermostat:
#   Langevin(dt; damping, kT)   stochastic Heun; samples classical Boltzmann.
#   ImplicitMidpoint(dt; tol)   symplectic, energy conserving; ERRORS if kT != 0.
# So ImplicitMidpoint cannot thermalize. It is used here only as a microcanonical
# cross-check: thermalize with Langevin, then time-average under conservative
# dynamics. Agreement between the two is evidence that the Langevin thermostat's
# discretization is not biasing M.

[paths]
base_controls_toml = "configs/sunny_validation_controls.toml"
figure_subdir = "results/figures/sunny_validation/largecell_mvh_classical"
table_subdir = "results/feature_tables/sunny_validation/largecell_mvh_classical"

[run]
# --- physical conditions ---------------------------------------------------
# Measurement temperature. Note the repo currently disagrees with itself:
# 0.42 K in the control TOMLs, 0.4 K as a legacy co-fit kwarg default, and no
# recorded provenance for either. 0.42 K is used here for consistency with
# [magnetization].temperature_K in the base controls.
temperature_K = 0.42

Bmin_T = 0.0
Bmax_T = 7.0
nB = 36

# Van Vleck is a single-ion term on the same Yb, not a second phase, so it is
# kept in the minimal model. A_M multiplies it too, so its contribution to the
# observable is A_M*chi_vv*B = 0.29 uB at 7 T for the fitted A_M ~ 0.52, against
# a measured 1.12 uB — about a quarter of the signal. Set false to drop it.
include_chi_vv = true

# --- cell size ------------------------------------------------------------
# Tunable cell size. `seed_dims` is the small system built before
# repeat_periodically; each entry of `cell_sizes` is the final supercell.
# 36x36x1 matches the KPM neutron calculation exactly.
#
# The strictly 2D model (no interlayer exchange) has a U(1) Goldstone mode below
# saturation, so classical thermal moment reduction is expected to grow like
# log(L) rather than converge. Reporting M versus L is therefore a measurement,
# not a knob to tune away.
# The first production run showed the free A_M flat to under 0.5% across
# 12/24/36, i.e. M(H) is already converged at 12x12x1 and the predicted log(L)
# Goldstone drift does not appear. 36x36x1 is retained as a spot check.
seed_dims = [3, 3, 1]
cell_sizes = [[12, 12, 1], [36, 36, 1]]

# --- disorder realizations -------------------------------------------------
# Changing the cell size also changes which random numbers land on which bond,
# so a cell-size scan is only interpretable when averaged over realizations.
# A "clean" variant has no disorder, so the script forces one realization there.
n_realizations = 3

# --- disorder variants -----------------------------------------------------
# "disordered" uses sigma_J and sigma_gzz as parameterized.
# "clean" sets both widths to zero on the same Hamiltonian, which isolates how
# much of the rounding of the saturation and of the initial slope is disorder.
disorder_variants = ["disordered", "clean"]

# --- samplers to compare ---------------------------------------------------
# minimize_energy       T = 0 reference (the existing large-cell scheme)
# langevin              classical Boltzmann at kT
# langevin_then_midpoint  Langevin thermalization, ImplicitMidpoint averaging
#
# The first run showed langevin and langevin_then_midpoint agreeing to 0.002 uB,
# so the midpoint cross-check is dropped from the default sweep to halve cost.
samplers = ["minimize_energy", "langevin"]

# --- Langevin controls -----------------------------------------------------
# suggest_timestep wants dt ~ 0.078 on this Hamiltonian at tol = 1e-2; 0.02 is
# deliberately conservative. dt_mode = "suggest" calls suggest_timestep and
# multiplies by dt_safety; "manual" uses dt below.
dt_mode = "manual"
dt = 0.02
dt_safety = 0.25
suggest_timestep_tol = 0.01
damping = 0.1
n_thermalize = 3000
n_sample = 500
sample_stride = 10

# Relax to the classical ground state at each field before heating to kT.
# This is not optional in practice: thermalizing straight from the previous
# field's thermal configuration does not converge in any affordable number of
# steps, and a test run without it returned M(7 T) ~ 0.02 uB instead of ~1.73.
relax_before_thermalize = true

# Equilibrium averages must not depend on `damping`. If they do, dt is too
# large. Leave empty to skip; otherwise a scan is run at `convergence_field_T`.
damping_scan = [0.05, 0.1, 0.2]
dt_scan = [0.04, 0.02, 0.01]
convergence_field_T = 9.0

# Sunny's |S|^2 = s(s+1) classical-to-quantum rescaling. Sunny's own docs say
# this is a HIGH-temperature fix and is explicitly not appropriate at low T, so
# it is off by default at 0.42 K. Flag retained for testing.
spin_rescaling_for_static_sum_rule = false

# --- validation above saturation -------------------------------------------
# Above saturation the field gaps the magnon spectrum, the quantum answer is
# M_sat to ~1e-8, and LSWT + Bose is well defined. Any Langevin deficit there is
# pure classical over-counting of high-energy modes, so this panel calibrates the
# systematic. Costs one dense 2N x 2N diagonalization per field.
#
# validation_variant = "clean" is important with strong gzz disorder. Low-g sites
# need many times more field to saturate, so a sigma_gzz = 0.8 cell is still
# GAPLESS at 9-14 T and the LSWT reference is invalid there (it reported a
# nonsense 27.9 uB depletion during testing). The clean system saturates near
# 5 T, so 9 and 14 T are safely gapped, and the per-mode classical over-counting
# is a generic property of classical statistics rather than of the disorder.
# The script now flags any point where the gap is not comfortably above kT.
validate_above_saturation = true
validation_variant = "clean"
validation_fields_T = [9.0, 14.0]
validation_lswt = true

# --- ground state / relaxation --------------------------------------------
initial_spin_state = "field_polarized"
# sigma_J = 0.5 makes the energy landscape harder; 10000 was hitting the
# non-convergence warning during testing.
minimize_maxiters = 30000
adiabatic_field_continuation = true

# --- reporting -------------------------------------------------------------
# Primary curve uses magnetization_global_scale from best_fit_parameters.toml.
# The free scale is reported alongside so the absolute-moment discrepancy is
# visible rather than absorbed into A_M.
report_free_scale = true
scale_fit_window_T = [0.0, 7.0]

plot_ylim = [0.0, 1.4]
title_suffix = "minimal single disordered phase, by-eye KPM parameters, sigma_J = 0.5"

# --- parameter overrides ---------------------------------------------------
# NOTE: this table must stay at the end of [run] — TOML requires a subtable to
# follow the parent table's bare keys.
#
# The by-eye Sunny-KPM neutron parameter set. These are NOT the canonical
# best-fit values in configs/best_fit_parameters.toml. The Sunny-KPM branch of
# the analysis needs substantially more disorder than the analytical branch,
# because in Sunny the disorder is one coupled Hamiltonian with mode mixing
# rather than an ensemble of independent clean regions.
#
# Differences from canonical: J1 0.2300 -> 0.25, J2 0.00872 -> 0.01,
# sigma_J 0.2397 -> 0.5, gzz 3.7846 -> 3.8, sigma_gzz 0.3859 -> 0.8.
#
# chi_vv_muB_per_T is deliberately NOT overridden. It was fitted inside the
# analytical model and carries that model's assumptions, so it is instead fitted
# here jointly with A_M and reported as chi_vv_joint_fit_muB_per_T.
#
# Comment this table out to return to the canonical parameter set.
[run.param_overrides]
J1_meV = 0.25
J2_meV = 0.01
sigma_J = 0.5
gzz = 3.8
sigma_gzz = 0.8

[control_overrides.common]
# Keep the same effective crystal, spin, field direction, and seed as the KPM
# neutron calculation so the two share one Hamiltonian convention.
field_direction = [0.0, 0.0, 1.0]
spin_S = 0.5
seed = 20260611

[control_overrides.largecell]
include_exchange_disorder = true
include_gzz_disorder = true
