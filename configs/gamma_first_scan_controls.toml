# Factorized "Gamma-first" parameter scan for the 1D neutron cuts.
#
# Exploits omega(0) = gzz*mu_B*B: at the zone center the exchange cancels identically,
# so (0,1,0) fixes gzz and sigma_gzz with (almost) no J dependence, and only then do
# the K and M cuts fix J1 and sigma_J. See the script header for the full argument and
# for what stage 1b measures.
#
# Sized for an unattended overnight run on the Windows box (32 cores). The script times
# a calibration point first and prints the projected total, so the log says up front
# whether it fits; the wall-clock budget then skips later stages rather than overrunning.
#
#   julia -t auto --project=. scripts/scan_gamma_first_parameters.jl

[paths]
base_controls_toml = "configs/sunny_validation_controls.toml"
table_subdir = "results/feature_tables/sunny_validation/gamma_first_scan"

[run]
# Production cell. Required by q resolution: the supercell quantizes q to 1/L = 0.028
# rlu against sigma_H = 0.037 rlu. 12x12x1 would be coarser than the resolution itself.
cell_size = [36, 36, 1]
seed_dims = [3, 3, 1]

# Realization averaging with common random numbers, so the objective is deterministic
# in the parameters and grid points are comparable.
#
# MEASURED COST at these settings, 36x36x1, sigma_J = 0.5, sigma_gzz = 0.8:
#   relaxation at  9 T   21.5 s per realization   <- the maxiters ladder is firing
#   relaxation at 14 T    0.20 s per realization   <- 100x cheaper, fully saturated
#   KPM                   0.233 s per q            <- 3x the clean-system figure
# Relaxation is 35% of the total and KPM 64%. Disorder inflates the Chebyshev moment
# count through the spectral width, which is why 0.233 and not the ~0.07 s/q that the
# clean-system benchmark suggests.
#
# 4 rather than 8 realizations because common random numbers make the DIFFERENCE between
# grid points far less noisy than the absolute chi2: the disorder configuration is
# identical at every grid point, so the sampling error is common mode and largely
# cancels in the ranking. Cutting tol instead would have been a poor trade -- cost goes
# as -log10(tol), so tol = 0.05 is only 24% cheaper than 0.02 while carrying ~10% rms
# model error that does NOT cancel, because it depends on the spectrum and the spectrum
# is what the parameters change. Better to average less and integrate accurately.
n_realizations = 4

# At 9 T under strong disorder minimize_energy! never satisfies its convergence test
# while E/site is converged by ~1000 iterations, so the cap is simply burned. Judge
# convergence by E/site, not by the returned flag.
minimize_maxiters = 1000

# Cut subsets that make the factorization. (0,1,0) is a reciprocal lattice point, hence
# the zone center, where J cancels; the other two are K and M.
gamma_qtags = ["0_1_0"]
dispersive_qtags = ["0p33_0p33_0", "0p5_0_0"]

# Stage 1: gzz sets the Zeeman peak position, sigma_gzz its width.
#
# RUN 1 RESULT (complete 6x6 grid over gzz 3.30-4.05, sigma_gzz 0.0-1.0):
#   chi2_red minimum 9.42 at gzz = 3.30, sigma_gzz = 0.80, with gzz = 3.45 tied at 9.60.
#   The by-eye gzz = 3.75-3.80 scores 21.87, i.e. 2.3x WORSE, and chi2 rises
#   monotonically above 3.6 (3.90 -> 31.3, 4.05 -> 39.9). The published 3.44 sits in the
#   minimum. sigma_gzz = 0.8 is a genuine INTERIOR minimum (0.6 -> 16.5, 1.0 -> 10.5),
#   so the by-eye sigma_gzz was right and it is gzz that was wrong.
#
# The run-1 minimum sat ON the lower gzz boundary, so this grid extends below it to find
# the true optimum, and narrows sigma_gzz to where run 1 showed it lives. Note the naive
# peak-position estimate gave gzz ~ 3.55; a mean gzz of 3.3 with sigma_gzz = 0.8 is a 24%
# spread, so the peak of the convolved lineshape is NOT at gzz_mean*mu_B*B and the fitted
# mean is expected to differ from the peak-position read. Per-cut chi2 columns are now
# written so the 9 T and 14 T preferences can be checked separately.
gzz_grid = [2.85, 3.00, 3.15, 3.30, 3.45, 3.60]
sigma_gzz_grid = [0.6, 0.7, 0.8, 0.9, 1.0]

# Stage 1b: how much does the Gamma chi2 actually move with J1? Flat => the
# factorization holds. Run 1 managed only two points before being suspended, but they
# showed 8.5% variation (chi2 8.69 at J1 = 0.20 vs 9.42 at 0.25), so the Gamma cut
# VOLUME does carry mild J sensitivity -- as expected, since the cut is 3x3 measured x
# 3x3 resolution q samples around (0,1,0) and not the zone-center point itself.
J1_probe_grid = [0.20, 0.25, 0.30, 0.35, 0.40]

# Stage 2: J1 sets the bandwidth at K and M, sigma_J the width in excess of what
# sigma_gzz already explains. The by-eye values are 0.25 and 0.5. J1 is extended well
# above 0.25 because the model currently peaks 10-20% BELOW the data at K and M, which
# is the whole reason to suspect sigma_J was standing in for a too-small bandwidth.
J1_grid = [0.20, 0.25, 0.30, 0.35, 0.40]
# sigma_J is capped at 0.6 deliberately. It is FRACTIONAL -- J*(1 + sigma_J*randn) --
# so bonds change sign when randn < -1/sigma_J: about 5% of bonds at 0.6, 2.3% at 0.5,
# but 16% at 1.0. Beyond ~0.6 this stops being "a broadened antiferromagnet" and
# becomes a random-sign bond model, which is different physics and not what is claimed.
sigma_J_grid = [0.0, 0.15, 0.30, 0.45, 0.60]

# Leave margin under a 12 h overnight window. Projected from the measured costs above:
# stage1 2.4 h + stage1b 0.3 + stage2 2.7 + stage3 0.6 + stage4 2.6 + summary 0.5 = 9.1 h.
# The script enforces PER-STAGE deadlines (30/35/65/72/95% of budget) so a stage that
# runs slower than projected is truncated -- its completed rows are already on disk --
# rather than being allowed to starve stage 4, which is the only guard against reporting
# a globally worse optimum.
wall_clock_budget_hours = 10.0

# Stage 3 is only a consistency recheck, so 3x3 is plenty. Run 1 had this hardcoded at
# 5x5 = 25 points, which was over-provisioned for a check and squeezed stage 4.
stage3_gzz_deltas = [-0.15, 0.0, 0.15]
stage3_sigma_gzz_deltas = [-0.2, 0.0, 0.2]

# Stage 4 coordinate-descent sweeps over all four parameters on all six cuts. This is
# what protects against the sequential trap: a smoke test showed stages 1-3 landing 73%
# WORSE on the global chi2 than the starting point, because gzz shifts the mode energy
# at every q and Gamma alone cannot see the cost it imposes at K and M.
refine_sweeps = 2

# RUN 3: stage 1 is settled by run 1's complete 6x6 surface, so carry its answer in and
# spend the box on the OPEN question -- the J1 x sigma_J valley at K and M. Stage 3's
# recheck deltas (-0.15, 0, +0.15) probe gzz = 3.15 and 3.45, so the below-3.30 question
# run 2 was going to answer is still covered, at the stage-2 J rather than the by-eye one.
skip_stage1 = true
gzz_fixed = 3.30
sigma_gzz_fixed = 0.80

# The escalation ladder chases a convergence flag that never trips at 9 T. Verified on
# both machines: 21.8x the relax cost for 5.8e-9 in E/site, and <=0.12% in the spectrum.
relax_attempts = 1

include_flat = false

# Starting point: the by-eye neutron parameters, which the summary stage also re-runs
# on all six cuts as the comparison baseline.
[run.param_overrides]
J1_meV = 0.25
J2_meV = 0.01
sigma_J = 0.5
gzz = 3.8
sigma_gzz = 0.8

[control_overrides.common]
field_direction = [0.0, 0.0, 1.0]
spin_S = 0.5
seed = 20260611

[control_overrides.kpm]
system_size = [36, 36, 1]
dims = [3, 3, 1]
repeat_factor = [12, 12, 1]
maxiters = 1000
# Pinned across every evaluation so grid points are apples-to-apples. The library
# escalates on a "Not an energy-minimum" abort, which would otherwise leave some
# parameter points computed at a different value from the rest.
regularization = 1e-5
# tol = 0.05 carries ~10% rms error, which is fine for looking at a lineshape but not
# for ranking parameter points, because the error depends on the spectrum and so does
# not cancel across the grid. 0.02 is the compromise the budget affords.
tol = 0.02

# Deterministic cut-volume grid: 3x3x1 measured x 3x3 resolution = 81 q per cut, the
# same setting as the production overplot so chi2 values are directly comparable.
[control_overrides.kpm.experimental_histogram]
enabled = true
mode = "analytical_cut_volume_grid"
n_measured_h = 3
n_measured_k = 3
n_measured_l = 1

[control_overrides.kpm.q_averaging]
enabled = true
n_h = 3
n_k = 3
n_l = 1
